name: Java CI with Maven (Week 09)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# --- BÀI 7: Cấp quyền cho GitHub Bot tự động bình luận vào PR ---
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # BÀI 6: Cache Maven dependencies
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # --- BÀI 3 BUILD ---
      - name: Build & Test (Bai9_3)
        run: mvn -B clean package --file Bai9_3/pom.xml

      # --- BÀI 4 BUILD ---
      - name: Build & Test (Bai9_4)
        run: mvn -B clean package --file Bai9_4/pom.xml

      # --- BÀI 5: BUILD & CHECK COVERAGE ---
      - name: Build, Test & Check Coverage (Bai9_5)
        run: mvn -B clean verify --file Bai9_5/pom.xml

      # --- BÀI 6: PIPELINE OPTIMIZATION ---
      - name: Build, Test & Verify (Bai9_6)
        run: mvn -B clean verify --file Bai9_6/pom.xml

      # --- BÀI 7: AUTOMATED CODE REVIEW & CHECKSTYLE ---
      - name: Run Checkstyle Inline Review (Bai9_7)
        uses: dbelyaev/action-checkstyle@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: error
          workdir: Bai9_7

      - name: Build, Test & Verify (Bai9_7)
        run: mvn -B clean verify --file Bai9_7/pom.xml

      # --- UPLOAD ARTIFACTS (Chỉ lưu trên Ubuntu để tránh trùng lặp) ---
      - name: Upload Artifact Bai9_3 (.jar)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: bai9-3-artifact
          path: Bai9_3/target/*.jar
          retention-days: 5

      - name: Upload JaCoCo Coverage Report (Bai9_5)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: bai9-5-jacoco-report
          path: Bai9_5/target/site/jacoco/
          retention-days: 5

      - name: Upload JaCoCo Coverage Report (Bai9_6)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: bai9-6-jacoco-report
          path: Bai9_6/target/site/jacoco/
          retention-days: 5

      - name: Upload JaCoCo Coverage Report (Bai9_7)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: bai9-7-jacoco-report
          path: Bai9_7/target/site/jacoco/
          retention-days: 5