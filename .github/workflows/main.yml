name: Java CI with Maven (Week 09)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Giữ các OS khác tiếp tục chạy ngay cả khi 1 OS bị lỗi
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # --- BÀI 3 BUILD ---
      - name: Build & Test (Bai9_3)
        run: mvn -B clean package --file Bai9_3/pom.xml

      # --- BÀI 4 BUILD ---
      - name: Build & Test (Bai9_4)
        run: mvn -B clean package --file Bai9_4/pom.xml

      # --- UPLOAD ARTIFACTS (Chỉ lưu 1 lần đại diện trên môi trường Ubuntu) ---
      - name: Upload Artifact Bai9_3 (.jar)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: bai9-3-artifact
          path: Bai9_3/target/*.jar
          retention-days: 5

      - name: Upload Artifact Bai9_4 (.jar)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: bai9-4-artifact
          path: Bai9_4/target/*.jar
          retention-days: 5