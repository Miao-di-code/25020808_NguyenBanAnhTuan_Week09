name: Java CI with Maven (Week 09)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # --- BÀI 3 BUILD ---
      - name: Build & Test (Bai9_3)
        run: mvn -B clean package --file Bai9_3/pom.xml

      # --- BÀI 4 & BÀI 5: BUILD, TEST & JACOCO VERIFY ---
      - name: Build, Test & Check Coverage (Bai9_4)
        run: mvn -B clean verify --file Bai9_4/pom.xml

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Artifact Bai9_3 (.jar)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: bai9-3-artifact
          path: Bai9_3/target/*.jar
          retention-days: 5

      - name: Upload JaCoCo Coverage Report (Bai9_4)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && always() # always() giúp lưu report kể cả khi build fail
        with:
          name: jacoco-coverage-report
          path: Bai9_4/target/site/jacoco/
          retention-days: 5