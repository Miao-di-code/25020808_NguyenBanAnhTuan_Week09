name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn từ repository
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Thiết lập môi trường Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Thực thi Maven Build Lifecycle (Clean, Compile, Test, Package)
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      # 4. Triển khai action upload-artifact để lưu giữ tệp .jar vừa build thành công
      - name: Upload Build Artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: bank-system-artifact
          path: target/*.jar
          retention-days: 5